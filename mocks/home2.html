<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1280px; height: 720px; overflow: hidden; background: #000; color: #fff;
         font-family: Inter, -apple-system, sans-serif; position: relative; -webkit-font-smoothing: antialiased; }

  /* Top shelf: full-bleed art for whatever the focused tile last played */
  .hero { position: absolute; top: 0; right: 0; width: 900px; height: 470px;
          background: url(art/bhootam.png) right top / cover no-repeat; filter: saturate(1.05); }
  .hero::after { content: ""; position: absolute; inset: 0;
          background: linear-gradient(90deg, #000 0%, rgba(0,0,0,.85) 22%, rgba(0,0,0,.2) 60%, rgba(0,0,0,0) 100%),
                      linear-gradient(0deg, #000 0%, rgba(0,0,0,0) 45%); }

  .top { position: absolute; top: 30px; left: 64px; right: 64px; display: flex; align-items: center; z-index: 3; }
  .pills { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .pill { height: 32px; padding: 0 15px; border-radius: 16px; display: flex; align-items: center; gap: 7px;
          font-size: 13px; font-weight: 500; color: rgba(255,255,255,.9);
          background: rgba(255,255,255,.14); backdrop-filter: blur(20px);
          box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
  .clock { font-size: 19px; font-weight: 500; margin-left: 14px; font-variant-numeric: tabular-nums; }

  .meta { position: absolute; left: 64px; top: 128px; width: 520px; z-index: 2; }
  .src { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: .08em;
         text-transform: uppercase; color: rgba(255,255,255,.6); }
  .src i { width: 18px; height: 18px; border-radius: 4px; background: linear-gradient(135deg,#3a3a3a,#0d0d0d);
           font: 300 11px Inter; color: #fff; display: grid; place-items: center; font-style: normal; }
  h1 { font-size: 54px; font-weight: 700; letter-spacing: -.025em; line-height: 1.02; margin-top: 12px; }
  .sub { font-size: 16px; color: rgba(255,255,255,.65); margin-top: 10px; }
  .prog { display: flex; align-items: center; gap: 10px; margin-top: 18px; font-size: 13px; color: rgba(255,255,255,.6); }
  .bar { width: 140px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.22); overflow: hidden; }
  .bar b { display: block; height: 100%; width: 62%; background: #fff; }
  .actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn { height: 40px; padding: 0 20px; border-radius: 10px; display: flex; align-items: center; gap: 8px;
         font-size: 15px; font-weight: 600; background: rgba(255,255,255,.16); }
  .btn.primary { background: #fff; color: #000; }

  .lbl { position: absolute; left: 64px; font-size: 15px; font-weight: 600; color: rgba(255,255,255,.75); }

  .apps { position: absolute; top: 440px; left: 64px; display: flex; gap: 22px; }
  .tile { width: 170px; height: 102px; border-radius: 16px; flex: none; display: flex; align-items: center; justify-content: center;
          font-weight: 700; font-size: 22px; position: relative; overflow: hidden;
          box-shadow: 0 8px 22px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12); }
  .tile.focus { transform: scale(1.14) translateY(-4px); z-index: 2;
          box-shadow: 0 24px 46px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.25); }
  .tile.focus::after { content:""; position:absolute; inset:0;
          background: linear-gradient(125deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,0) 38%); }
  .nf { background: #000; color: #e50914; font-size: 27px; font-weight: 800; }
  .pv { background: #00a8e1; font-size: 20px; font-weight: 600; }
  .yt { background: #fff; color: #111; font-size: 21px; } .yt b { background:#f00;color:#fff;border-radius:6px;padding:1px 8px;margin-right:6px;font-size:12px; }
  .jh { background: linear-gradient(120deg, #1240ff, #9b1ccf 60%, #ff2d87); font-size: 20px; }
  .z5 { background: linear-gradient(135deg, #3a3a3a, #0d0d0d); font-size: 34px; font-weight: 300; }
  .sl { background: linear-gradient(135deg, #2b0a3d, #050505); font-size: 19px; }
  .at { background: #151515; font-size: 24px; font-weight: 500; }

  .cw { position: absolute; top: 612px; left: 64px; display: flex; gap: 18px; }
  .card { width: 240px; height: 135px; border-radius: 12px; overflow: hidden; position: relative; flex: none;
          background-size: cover; background-position: center; box-shadow: 0 8px 22px rgba(0,0,0,.6); }
  .card::after { content:""; position:absolute; inset:0; background: linear-gradient(0deg, rgba(0,0,0,.7), transparent 55%); }
  .card .p { position: absolute; left: 10px; right: 10px; bottom: 9px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.3); z-index: 1; }
  .card .p b { display:block; height:100%; background:#fff; border-radius: 2px; }
  .card .a { position: absolute; top: 8px; left: 8px; z-index: 1; font-size: 10px; font-weight: 700; padding: 3px 6px;
             border-radius: 5px; background: rgba(0,0,0,.55); backdrop-filter: blur(8px); letter-spacing: .04em; }
</style></head>
<body>
<div class="hero"></div>

<div class="top">
  <div class="pills">
    <div class="pill">▭ Fire TV</div>
    <div class="pill">Inputs</div>
    <div class="pill">⚙︎</div>
    <div class="clock">8:42</div>
  </div>
</div>

<div class="meta">
  <div class="src"><i>Z5</i>Continue on ZEE5</div>
  <h1>Bhootam Bhayyam</h1>
  <div class="sub">Horror comedy · 2026 · U/A 13+</div>
  <div class="prog"><div class="bar"><b></b></div>48 min left</div>
  <div class="actions">
    <div class="btn primary">▶ Resume</div>
    <div class="btn">Open ZEE5</div>
  </div>
</div>

<div class="apps">
  <div class="tile z5 focus">Z5</div>
  <div class="tile nf">NETFLIX</div>
  <div class="tile yt"><b>▶</b>YouTube</div>
  <div class="tile jh">✶ JioHotstar</div>
  <div class="tile pv">prime video</div>
  <div class="tile at">tv</div>
</div>

<div class="lbl" style="top:584px">Continue Watching</div>
<div class="cw">
  <div class="card" style="background-image:url(art/awakening.png)"><span class="a">PRIME</span><div class="p"><b style="width:30%"></b></div></div>
  <div class="card" style="background-image:url(art/t1.png)"><span class="a">JIOHOTSTAR</span><div class="p"><b style="width:75%"></b></div></div>
  <div class="card" style="background-image:url(art/t4.png)"><span class="a">NETFLIX</span><div class="p"><b style="width:45%"></b></div></div>
  <div class="card" style="background-image:url(art/t5.png)"><span class="a">SONYLIV</span><div class="p"><b style="width:12%"></b></div></div>
  <div class="card" style="background-image:url(art/t2.png)"><span class="a">YOUTUBE</span><div class="p"><b style="width:88%"></b></div></div>
</div>
</body></html>
