plugins {
    id 'com.android.application'
}

// Secrets live in local.properties (gitignored):
//   tmdb.key=<TMDB v3 API key>
//   feed.<profile id>=<Apps Script web-app URL with ?k=TOKEN>[,<another account's URL>]
def localProps = new Properties()
def lp = rootProject.file('local.properties')
if (lp.exists()) lp.withInputStream { localProps.load(it) }
def feeds = localProps.stringPropertyNames().findAll { it.startsWith('feed.') }.sort()
        .collect { it.substring(5) + '=' + localProps.getProperty(it).trim() }.join(';')

android {
    namespace 'com.dhiram.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dhiram.tvhome'
        minSdk 30
        targetSdk 30
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'TMDB_KEY', "\"${localProps.getProperty('tmdb.key', '')}\""
        buildConfigField 'String', 'FEEDS', "\"${feeds}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        // What goes on the TV: shrunk and optimised by R8, then fully AOT-compiled at install
        // (build-and-install.sh). Signed with the debug key so it upgrades the installed app in place.
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.debug
        }
    }

    // Sideloaded onto an Android 11 TV, never published: targetSdk 30 matches the device on purpose.
    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
